# .github/workflows/docker-build.yml

name: Build and Push Docker Image

on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 为 tag push 事件生成标签，例如 v1.2.3
            type=semver,pattern={{version}}
            # 为 tag push 事件生成次要版本标签，例如 v1.2
            type=semver,pattern={{major}}.{{minor}}
            # 为 main 分支的 push 事件生成 'main' 标签
            type=ref,event=branch
            # 为每次 commit 生成一个基于 SHA 的唯一标签
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6 # 使用最新的 v6 版本
        with:
          context: . # 构建上下文是项目根目录
          file: ./Dockerfile # 明确指定 Dockerfile 路径
          push: true # 在触发事件时总是推送镜像
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 启用 GitHub Actions 的缓存，加快后续构建速度
          cache-from: type=gha
          cache-to: type=gha,mode=max